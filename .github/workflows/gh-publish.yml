name: Publish to NPM Registry

on:
  pull_request:
    branches: [master, v6, v7]
    types: [closed, opened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number (for manual alpha)"
        required: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      release_type: ${{ steps.resolve.outputs.release_type }}
      version: ${{ steps.resolve.outputs.version }}
      dist_tag: ${{ steps.resolve.outputs.dist_tag }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/resolve-version
        id: resolve

  tests:
    if: needs.resolve-version.outputs.release_type != 'skip'
    needs: resolve-version
    uses: ./.github/workflows/version-tests.yml

  all-tests-pass:
    if: needs.resolve-version.outputs.release_type != 'skip'
    runs-on: ubuntu-latest
    needs: [tests, resolve-version]
    steps:
      - run: echo "All tests completed"

  publish:
    if: needs.resolve-version.outputs.release_type != 'skip'
    needs: [all-tests-pass, resolve-version]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-node
        with:
          ref: ${{ needs.resolve-version.outputs.release_type == 'stable' && github.sha || '' }}
      - name: Version bump (alpha)
        if: needs.resolve-version.outputs.release_type == 'alpha'
        run: pnpm version-all "${{ needs.resolve-version.outputs.version }}" -y
      - name: Commit version bump (alpha)
        if: needs.resolve-version.outputs.release_type == 'alpha'
        run: |
          git add -A
          git commit -m "chore: version bump to ${{ needs.resolve-version.outputs.version }} [skip ci]" --no-verify || echo "No changes to commit"
          # Intentionally not pushed — lerna reads local package.jsons for from-package publish
      - name: Build packages
        run: pnpm build
      - name: Set Current Version (stable)
        if: needs.resolve-version.outputs.release_type == 'stable'
        run: |
          CURRENT_VERSION=$(node -p 'require("./lerna.json").version')
          echo "CURRENT_VERSION=${CURRENT_VERSION}" >> $GITHUB_ENV
      - name: Tag Check (stable)
        if: needs.resolve-version.outputs.release_type == 'stable'
        id: tag_check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GET_API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/v${CURRENT_VERSION}"
          http_status_code=$(curl -LI $GET_API_URL -o /dev/null -w '%{http_code}\n' -s \
            -H "Authorization: token ${GITHUB_TOKEN}")
          if [ "$http_status_code" -ne "404" ] ; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Publish (alpha)
        if: needs.resolve-version.outputs.release_type == 'alpha'
        run: npm run publish -- --dist-tag ${{ needs.resolve-version.outputs.dist_tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      - name: Publish (stable)
        if: needs.resolve-version.outputs.release_type == 'stable' && steps.tag_check.outputs.exists != 'true'
        run: npm run publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      - name: Create Tag and Release (stable)
        if: needs.resolve-version.outputs.release_type == 'stable' && steps.tag_check.outputs.exists != 'true'
        id: release
        uses: ./.github/actions/create-release
        with:
          version: ${{ env.CURRENT_VERSION }}
          release-body: ${{ github.event.pull_request.body }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/comment-pr-publish
        if: needs.resolve-version.outputs.release_type == 'alpha' || (needs.resolve-version.outputs.release_type == 'stable' && steps.tag_check.outputs.exists != 'true')
        with:
          release-type: ${{ needs.resolve-version.outputs.release_type }}
          version: ${{ needs.resolve-version.outputs.version }}
          pr-number: ${{ needs.resolve-version.outputs.pr_number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
